<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>RC BRICK SHOP — Order Picker</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#15171a;background:#f3f5f7}*{box-sizing:border-box}body{margin:0}.app{max-width:760px;margin:auto;min-height:100vh;padding:calc(14px + env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.brand{font-weight:950;font-size:22px;letter-spacing:-.3px}.sub{font-size:14px;color:#6a7078;margin-top:2px}.badge{font-size:10px;font-weight:800;background:#111;color:white;padding:7px 10px;border-radius:99px}.upload{display:block;margin:18px 0 14px;border:2px dashed #aab3bf;border-radius:18px;background:#fff;padding:24px 16px;text-align:center;font-weight:800;cursor:pointer}.upload small{display:block;font-weight:500;color:#69717a;margin-top:5px}.upload input{display:none}.stats{position:sticky;top:calc(8px + env(safe-area-inset-top));z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid #dfe4e9;border-radius:18px;padding:14px;box-shadow:0 5px 18px #00000014}.statline{display:flex;justify-content:space-between;align-items:baseline;font-weight:950;font-size:17px}.progress{height:12px;background:#e4e8ec;border-radius:99px;margin-top:10px;overflow:hidden}.bar{height:100%;background:#20a45b;width:0;transition:.2s}.meta{font-size:12px;color:#6d747c;margin-top:8px}.filters{position:sticky;top:calc(112px + env(safe-area-inset-top));z-index:19;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0;padding:6px;background:#f3f5f7}.filters button{border:1px solid #d3d8de;background:white;border-radius:13px;padding:13px 4px;font-weight:900;font-size:13px;min-height:46px}.filters button.on{background:#111;color:#fff}.group{margin:20px 2px 8px;font-size:29px;font-weight:1000;letter-spacing:-.4px;color:#111}.card{width:100%;border:1px solid #d7dde3;background:#fff;border-radius:18px;padding:17px 15px;margin:9px 0;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;box-shadow:0 2px 7px #0000000d;transition:transform .08s,background .15s,border-color .15s;min-height:94px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.card:active{transform:scale(.985)}.card.picked{background:#d9f7e4;border:2px solid #32a85e;box-shadow:0 2px 9px #1f9d5520}.title{font-size:17px;font-weight:850;line-height:1.22}.pick{font-size:27px;font-weight:1000;white-space:nowrap;letter-spacing:-.5px}.detail{font-size:12.5px;color:#69717a;margin-top:7px;line-height:1.35}.picked .detail{color:#39704d}.check{font-size:14px;font-weight:900;color:#168348;margin-top:4px}.empty{text-align:center;color:#737a82;background:white;border-radius:18px;padding:36px 16px;margin-top:14px}.actions{display:flex;gap:8px;margin-top:10px}.actions button{border:0;border-radius:10px;padding:9px 12px;font-weight:800}.reset{background:#eceff2}.file{font-size:12px;color:#69717a;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}@media(max-width:430px){.app{padding-left:10px;padding-right:10px}.top{align-items:center}.brand{font-size:20px}.badge{padding:6px 8px}.upload{padding:20px 12px;margin:14px 0 12px}.stats{top:calc(6px + env(safe-area-inset-top))}.filters{top:calc(110px + env(safe-area-inset-top));margin-left:-4px;margin-right:-4px}.group{font-size:28px}.card{padding:16px 13px;gap:9px;min-height:96px}.title{font-size:16px}.pick{font-size:25px}.detail{font-size:11.5px}.meta{font-size:11px}}@media(min-width:700px){.app{padding-left:24px;padding-right:24px}.card{padding:16px}.title{font-size:16px}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a84ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Order Picker">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head><body><main class='app'><div class='top'><div><div class='brand'>RC BRICK SHOP</div><div class='sub'>Order Picker · Mobile</div></div><div class='badge'>MODULE 01 · v0.2</div></div>
<label class='upload'>Upload eBay Paid & Shipped CSV<small>Tap here to choose your order report</small><input id='file' type='file' accept='.csv,text/csv'></label>
<section id='stats' class='stats' hidden><div class='statline'><span id='progressText'>0 / 0 picked</span><span id='pct'>0%</span></div><div class='progress'><div id='bar' class='bar'></div></div><div id='meta' class='meta'></div><div id='fname' class='file'></div><div class='actions'><button class='reset' id='reset'>Reset picked status</button></div></section>
<div id='filters' class='filters' hidden><button data-f='all' class='on'>ALL</button><button data-f='unpicked'>UNPICKED</button><button data-f='picked'>PICKED</button></div><div id='list'><div class='empty'>Upload an eBay report to start a picking session.</div></div></main>
<script>
let rows=[], filter='all', sessionKey=''; const $=s=>document.querySelector(s);
function parseCSV(t){let out=[],row=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(q){if(c==='"'&&n==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else{if(c==='"')q=true;else if(c===','){row.push(v);v=''}else if(c==='\n'){row.push(v.replace(/\r$/,''));out.push(row);row=[];v=''}else v+=c}}if(v||row.length){row.push(v);out.push(row)}return out}
function natural(a,b){return a.localeCompare(b,undefined,{numeric:true,sensitivity:'base'})}
function cleanTitle(t){return t.replace(/^LEGO Parts\s*-\s*/i,'').replace(/\s*-\s*QTY\s*\d+\s*$/i,'').trim()}
function render(){let picked=rows.filter(r=>r.picked).length,total=rows.length,pct=total?Math.round(picked/total*100):0;$('#progressText').textContent=`${picked} / ${total} picked`;$('#pct').textContent=pct+'%';$('#bar').style.width=pct+'%';let shown=rows.filter(r=>filter==='all'||(filter==='picked'?r.picked:!r.picked));let html='',last='';for(const r of shown){if(r.bin!==last){html+=`<div class='group'>${esc(r.bin)}</div>`;last=r.bin}html+=`<button class='card ${r.picked?'picked':''}' data-id='${r.id}'><div><div class='title'>${esc(r.shortTitle)}</div><div class='detail'>Order ${esc(r.order)} · SKU ${esc(r.sku)} · ${r.units} listing unit${r.units==1?'':'s'} × QTY ${r.pack}</div>${r.picked?"<div class='check'>✓ PICKED — tap to undo</div>":''}</div><div class='pick'>PICK ${r.pieces}</div></button>`}$('#list').innerHTML=html||`<div class='empty'>No ${filter} items.</div>`;document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{let r=rows.find(x=>x.id===b.dataset.id);r.picked=!r.picked;save();render()})}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(){localStorage.setItem(sessionKey,JSON.stringify(Object.fromEntries(rows.map(r=>[r.id,r.picked]))))}
function loadStatus(){try{return JSON.parse(localStorage.getItem(sessionKey)||'{}')}catch{return {}}}
$('#file').onchange=async e=>{let f=e.target.files[0];if(!f)return;let t=await f.text(),a=parseCSV(t),hi=a.findIndex(r=>r.includes('Order Number')&&r.includes('Item Title'));if(hi<0)return alert('Could not find the eBay report header.');let h=a[hi],ix=n=>h.indexOf(n),data=a.slice(hi+1).filter(r=>(r[ix('Item Title')]||'').trim());sessionKey='rcbs-picker:'+f.name+':'+f.size;let old=loadStatus();rows=data.map((r,i)=>{let title=r[ix('Item Title')]||'',sku=(r[ix('Custom Label')]||'').trim(),units=parseInt(r[ix('Quantity')])||1,m=title.match(/QTY\s*(\d+)/i),pack=m?parseInt(m[1]):1,bin=(sku.split('-')[0]||'UNKNOWN').trim();let id=[r[ix('Order Number')],sku,title,i].join('|');return{id,order:r[ix('Order Number')]||'',sku,bin,title,shortTitle:cleanTitle(title),units,pack,pieces:units*pack,picked:!!old[id]}}).sort((a,b)=>natural(a.bin,b.bin)||natural(a.shortTitle,b.shortTitle));$('#stats').hidden=false;$('#filters').hidden=false;$('#meta').textContent=`${new Set(rows.map(r=>r.order)).size} orders · ${rows.length} line items · ${rows.reduce((s,r)=>s+r.units,0)} listing units · ${rows.reduce((s,r)=>s+r.pieces,0)} physical pieces`;$('#fname').textContent=f.name;render()}
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b));render()});$('#reset').onclick=()=>{if(confirm('Reset every item to unpicked?')){rows.forEach(r=>r.picked=false);save();render()}}
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body></html>
